# Complete configuration template for installations that need infrastructure
# overrides. Copy this file to budgeted-config.toml before customizing it.

[app]
name = "budgeted"
productionStage = "production"

[stages.production.deployment]
# Production stages are protected and retained by default.
protect = true
# One of: remove, retain, retain-all.
removal = "retain"

# Uncomment to configure a custom domain. Without it, SST provides a URL.
# [stages.production.webDomain]
# name = "budgeted.example.com"
# dns = false
# cert = "arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000"

# Uncomment when the Amazon order scraper is used.
# [stages.production.integrations.amazonOrders]
# apiUrl = "https://amazon-scraper.example.com"

[stages.production.integrations.plaid]
# One of: sandbox, development, production.
environment = "sandbox"

[stages.production.infrastructure.assetLifecycle]
# Cleans up untagged images from SST's asset repository.
enabled = true
repository = "sst-asset"
expireUntaggedAfterDays = 3

[stages.production.infrastructure.artifacts]
ledgerExportRetentionDays = 1
ynabImportRetentionDays = 2
# Restrict this list when browser uploads should only originate from known URLs.
ynabImportAllowedOrigins = ["*"]

[stages.production.infrastructure.automation]
enabled = true
schedule = "cron(0/2 * * * ? *)"
retries = 0
timeout = "15 minutes"

[stages.production.infrastructure.ynabImportWorker]
memory = "2 GB"
timeout = "15 minutes"

[stages.production.infrastructure.web]
timeout = "60 seconds"

# Uncomment when Venmo email ingestion is used.
# [stages.production.venmoEmail]
# allowedForwarders = ["trusted-forwarder@example.com"]
# recipient = "venmo@aws.example.com"
# receiptRuleSetName = "EXISTING_ACTIVE_RULE_SET"
# afterRuleName = "EXISTING_RULE_NAME"
