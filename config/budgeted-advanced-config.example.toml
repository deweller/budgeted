# Complete configuration template for installations that need infrastructure
# overrides. Copy this file to budgeted-config.toml before customizing it.

[app]
name = "budgeted"
productionStage = "production"

[stages.production]

# Production stages are protected and retained by default.
deployment.protect = true
# One of: remove, retain, retain-all.
deployment.removal = "retain"

# Uncomment to configure a custom domain. Without it, SST provides a URL.
# webDomain.name = "budgeted.example.com"
# webDomain.dns = false
# webDomain.cert = "arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000"

# Uncomment when the Amazon order scraper is used.
# integrations.amazonOrders.apiUrl = "https://amazon-scraper.example.com"

# One of: sandbox, development, production.
integrations.plaid.environment = "sandbox"

# Cleans up untagged images from SST's asset repository.
infrastructure.assetLifecycle.enabled = true
infrastructure.assetLifecycle.repository = "sst-asset"
infrastructure.assetLifecycle.expireUntaggedAfterDays = 3

infrastructure.artifacts.ledgerExportRetentionDays = 1
infrastructure.artifacts.ynabImportRetentionDays = 2
# Restrict this list when browser uploads should only originate from known URLs.
infrastructure.artifacts.ynabImportAllowedOrigins = ["*"]

infrastructure.automation.enabled = true
infrastructure.automation.schedule = "cron(0/2 * * * ? *)"
infrastructure.automation.retries = 0
infrastructure.automation.timeout = "15 minutes"

infrastructure.ynabImportWorker.memory = "2 GB"
infrastructure.ynabImportWorker.timeout = "15 minutes"

infrastructure.web.timeout = "60 seconds"

# Uncomment when Venmo email ingestion is used.
# venmoEmail.allowedForwarders = ["trusted-forwarder@example.com"]
# venmoEmail.recipient = "venmo@aws.example.com"
# venmoEmail.receiptRuleSetName = "EXISTING_ACTIVE_RULE_SET"
# venmoEmail.afterRuleName = "EXISTING_RULE_NAME"
